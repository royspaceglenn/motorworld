# Render Blueprint — Motor World API (Express + SQLite)
# https://render.com/docs/blueprint-spec
#
# After deploy: set MOTOR_WORLD_ORIGINS to your Vercel / custom-domain URL(s).
# Legacy names still work: CORS_ORIGINS, JWT_SECRET.
# Persistent SQLite (survives redeploys): upgrade to Starter, add Disk mount /data,
# set SQLITE_DB_PATH=/data/motorworld.sqlite in the dashboard. Code pushes do NOT wipe the DB.

services:
  - type: web
    name: motorworld-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm install --prefix server
    startCommand: cd server && NODE_ENV=production node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MOTOR_WORLD_APP_SECRET
        sync: false
      - key: MOTOR_WORLD_ORIGINS
        sync: false
